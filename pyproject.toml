[project]
name = "python-mastery-sandbox"
version = "0.1.0"
description = "Comprehensive Python Language Mastery: Deep Internals, Production CLI Scripts, and 100% Test Coverage"
requires-python = ">=3.12"
dependencies = [
    "rich>=13.7.0",
    "tabulate>=0.9.0",
    "typing-extensions>=4.12.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.11.0",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["test"]
addopts = "--cov-report=term-missing"
